<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>صفحة العهدة</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 🧰 (V4.612) صفحة مسؤول العهدة — مستقلة تماماً عن البرنامج: دخول بنفس المستخدم، ولا تعرض إلا العهد المخصصة له (240_cust_desk.sql) */
:root{--n:#1e3d59;--g:#0f6b55;--bg:#f3f5f7;--ln:#d5dde5;--mut:#64748b;--red:#b91c1c;--grn:#15803d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1f2937;font-family:Tajawal,Cairo,system-ui,sans-serif;font-size:15px}
h1,h2,b,th,button{font-family:Cairo,Tajawal,sans-serif}
.top{background:linear-gradient(135deg,#1e3d59,#0f4c4c);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;font-weight:800}.top select{border-radius:8px;border:0;padding:5px 8px;font-family:inherit;font-size:14px;max-width:60vw}
.top .sp{flex:1}.btn{border:0;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:14px}
.b1{background:var(--g);color:#fff}.b2{background:#fff;color:var(--n)}.b3{background:#e2e8f0;color:#1f2937}.bd{background:#fee2e2;color:var(--red)}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.kp div{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.kp small{color:var(--mut);display:block;font-size:12px}.kp b{font-size:18px;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
@media(max-width:640px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}}
.frm{display:grid;grid-template-columns:130px 120px 120px minmax(0,1fr) auto;gap:8px;align-items:end}
.frm.pt{grid-template-columns:130px 120px 120px minmax(0,1fr) minmax(0,1fr) auto}
@media(max-width:760px){.frm,.frm.pt{grid-template-columns:1fr 1fr}.frm .w2{grid-column:1/-1}}@media(min-width:761px){.frm .w2{grid-column:auto}}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;font-family:inherit;font-size:15px;background:#fff}
input:focus{outline:2px solid #99c9bb;border-color:var(--g)}.num{direction:ltr;text-align:center;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{background:#7d5a2c;color:#fff;padding:8px;font-size:13px;position:sticky;top:0}td{padding:7px 8px;border-bottom:1px solid #e8edf2;text-align:center}
td.d{text-align:right}tr.pend td{background:#fffbeb}tfoot td{background:#f1f5f9;font-weight:800;border-top:2px solid var(--n)}
.in{color:var(--grn);font-weight:700}.out{color:var(--red);font-weight:700}.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.t1{background:#fef3c7;color:#92400e}.t2{background:#dcfce7;color:#166534}
.lg{max-width:360px;margin:12vh auto;background:#fff;border-radius:14px;padding:22px;border:1px solid var(--ln)}
.lg h2{margin:0 0 4px;font-size:19px;color:var(--n)}.err{color:var(--red);font-weight:700;font-size:13px;min-height:18px;margin:6px 0}
.lnk{background:none;border:0;color:#2563eb;cursor:pointer;font-size:13px;padding:0 4px}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:10px;padding:9px 16px;font-size:14px;z-index:20;display:none}
select{border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;font-family:inherit;font-size:15px;background:#fff;width:100%}.top select{width:auto}
th{cursor:grab;user-select:none;white-space:nowrap}th.dg{opacity:.4}tr.flt td{background:#f8fafc;padding:3px 4px}tr.flt input{padding:3px 6px;font-size:12.5px;border-radius:6px}
td.d{min-width:240px;white-space:normal}tr.redo td{background:#fff1f2}.t3{background:#ffe4e6;color:#9f1239}.t4{background:#e2e8f0;color:#334155}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}.dlg{background:#fff;border-radius:12px;padding:14px;max-width:560px;width:100%;max-height:86vh;overflow:auto}
@media(min-width:761px){.frm{grid-template-columns:170px 110px 110px 100px minmax(0,1fr) auto}.frm.pt{grid-template-columns:170px 110px 110px 100px minmax(0,1.4fr) minmax(0,1fr) auto}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="login" class="lg" hidden>
  <h2>🧰 صفحة العهدة</h2><div style="color:#64748b;font-size:13px">ادخل باسم المستخدم وكلمة المرور الخاصة بك</div>
  <div style="margin-top:12px"><label>اسم المستخدم</label><input id="lu" autocomplete="username"></div>
  <div style="margin-top:8px"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password"></div>
  <div id="lerr" class="err"></div>
  <button class="btn b1" style="width:100%" id="lbtn" onclick="doLogin()">دخول</button>
</div>
<div id="app" hidden>
  <div class="top"><h1>🧰 العهدة</h1><select id="desk" onchange="pickDesk(this.value)"></select><span class="sp"></span><span id="who" style="font-size:13px"></span>
    <button class="btn b2" onclick="colMenu()">⚙ الأعمدة</button><button class="btn b2" onclick="load()">🔄</button><button class="btn b2" onclick="logout()">خروج</button></div>
  <div class="wrap">
    <div id="kp" class="kp" style="margin-bottom:12px"></div>
    <div class="card">
      <div id="frm" class="frm">
        <div class="w2"><label>التاريخ</label><div style="display:flex;gap:4px"><input id="fDate" class="num" placeholder="dd/mm/yyyy" inputmode="numeric" onblur="fixDate(this)"><button type="button" class="btn b3" style="padding:7px 9px" title="التقويم" onclick="pickCal()">📅</button><input id="fCal" type="date" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none" tabindex="-1" onchange="calPicked(this)"></div></div>
        <div><label>وارد</label><input id="fIn" class="num" inputmode="decimal" oninput="chkBoth()"></div>
        <div><label>منصرف</label><input id="fOut" class="num" inputmode="decimal" oninput="chkBoth()"></div>
        <div><label>العملة</label><select id="fCur"><option value="SAR">ريال</option><option value="EGP">جنيه</option><option value="USD">دولار</option></select></div>
        <div class="w2"><label>البيان</label><input id="fDesc"></div>
        <div class="w2" id="fPartyBox" hidden><label>الطرف المقابل (اختياري)</label><input id="fParty"></div>
        <div class="w2" style="display:flex;gap:6px"><button class="btn b1" id="fBtn" onclick="saveRow()">➕ تسجيل</button><button class="btn b3" id="fCancel" onclick="editRow(0)" hidden>إلغاء</button></div>
      </div>
      <div id="ferr" class="err"></div>
    </div>
    <div class="tw"><table id="tbl"><thead id="th"></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table></div>
    <div style="color:#64748b;font-size:12.5px;margin-top:8px">الحركة «بانتظار المحاسب» يمكنك تعديلها أو حذفها. تعديل حركة لها قيد يعيدها للمراجعة والاعتماد. اسحب رأس العمود لتغيير ترتيبه، واكتب تحته للتصفية.</div>
  </div>
</div>
<div id="ov" class="ov" hidden onclick="if(event.target===this)this.hidden=true"><div class="dlg"><div id="ovB"></div><div style="text-align:left;margin-top:10px"><button class="btn b3" onclick="document.getElementById('ov').hidden=true">إغلاق</button></div></div></div>
<div id="msg" class="msg"></div>
<script>
(function(){
var EXEC='https://script.google.com/macros/s/AKfycbzmZ7ubyNlqjum0SlNSDqmIAN1VqDNd9FU-eM6Ihqg17-MAb_QnV7cDKCGaVJ_6-2iA7g/exec';
var S={pub:null,tok:'',exp:0,user:'',desks:[],acc:'',d:null,edit:0};
var LS=function(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}};
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var fmt=function(n){n=+n||0;return n.toLocaleString('en-US',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});};
var toast=function(t){var m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){m.style.display='none';},2600);};
var FN_RX=/^https:\/\/[a-z0-9]+\.supabase\.co\/functions\/v1\/app$/;
function pub(){
  if(S.pub)return Promise.resolve(S.pub);
  var fn=LS('app_fn');
  var p=fn&&FN_RX.test(fn)?Promise.resolve(fn):fetch(EXEC+'?appcfg=1',{redirect:'follow'}).then(function(r){return r.json();}).then(function(j){if(!j||!j.ok||!FN_RX.test(j.app))throw new Error('cfg');LS('app_fn',j.app);return j.app;});
  return p.then(function(f){return fetch(f+'?pub=1').then(function(r){return r.json();});}).then(function(j){if(!j||!j.url||!j.anon)throw new Error('pub');S.pub=j;return j;});
}
function rpc(fn,body,tok){
  return pub().then(function(P){return fetch(P.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:P.anon,Authorization:'Bearer '+(tok===null?P.anon:(tok||S.tok)),'Content-Type':'application/json'},body:JSON.stringify(body||{})});})
    .then(function(r){return r.text().then(function(t){var j=null;try{j=JSON.parse(t);}catch(e){}if(!r.ok){var er=new Error((j&&j.message)||('خطأ '+r.status));er.status=r.status;throw er;}return j;});});
}
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2);}).join('');});}
function adopt(j){S.tok=j.token;S.exp=+j.expiresAt||0;S.user=j.username;try{sessionStorage.setItem('cd_tok',JSON.stringify({t:S.tok,e:S.exp,u:S.user}));}catch(e){}}
window.doLogin=function(){
  var u=$('lu').value.trim(),p=$('lp').value;if(!u||!p){$('lerr').textContent='اكتب اسم المستخدم وكلمة المرور';return;}
  $('lbtn').disabled=true;$('lerr').textContent='';
  sha(p).then(function(h){return rpc('app_login',{p_user:u,p_hash:h},null);}).then(function(j){
    $('lbtn').disabled=false;
    if(!j||!j.success||!j.token){$('lerr').textContent='بيانات الدخول غير صحيحة (أو يلزم تغيير كلمة المرور من البرنامج)';return;}
    adopt(j);$('lp').value='';
    rpc('app_dev_issue',{}).then(function(k){if(k&&k.key)LS('cd_dev',k.key);},function(){});
    start();
  },function(e){$('lbtn').disabled=false;$('lerr').textContent='تعذّر الاتصال: '+e.message;});
};
window.logout=function(){var k=LS('cd_dev');if(k)rpc('app_dev_revoke',{p_key:k},null).then(function(){},function(){});LS('cd_dev',null);try{sessionStorage.removeItem('cd_tok');}catch(e){}S.tok='';show(false);};
function show(inApp){$('login').hidden=inApp;$('app').hidden=!inApp;}
function resume(){
  try{var c=JSON.parse(sessionStorage.getItem('cd_tok')||'null');if(c&&c.t&&c.e-Date.now()>600000){S.tok=c.t;S.exp=c.e;S.user=c.u;return Promise.resolve(true);}}catch(e){}
  var k=LS('cd_dev');if(!k)return Promise.resolve(false);
  return rpc('app_dev_resume',{p_key:k},null).then(function(j){if(j&&j.success&&j.token){adopt(j);return true;}if(j&&j.error&&j.error!=='fallback')LS('cd_dev',null);return false;},function(){return false;});
}
function renewMaybe(){if(S.tok&&S.exp-Date.now()<3600000)rpc('app_renew',{}).then(function(j){if(j&&j.success&&j.token)adopt({token:j.token,expiresAt:j.expiresAt,username:S.user});},function(){});}
function start(){
  rpc('cd_my',{}).then(function(j){
    S.desks=(j&&j.desks)||[];
    if(!S.desks.length){show(false);$('lerr').textContent='لا توجد عهدة مخصصة لهذا المستخدم — راجع المدير';S.tok='';return;}
    show(true);$('who').textContent=S.user;
    $('fCur').onchange=function(){this.dataset.set='1';};$('desk').innerHTML=S.desks.map(function(d){return '<option value="'+esc(d.acc)+'">'+esc(d.name)+'</option>';}).join('');$('desk').hidden=S.desks.length<2;
    var last=LS('cd_acc');pickDesk(S.desks.some(function(d){return d.acc===last;})?last:S.desks[0].acc);
  },function(e){if(e.status===401||e.status===403){S.tok='';show(false);}else toast('تعذّر التحميل: '+e.message);});
}
var CUR={SAR:'ريال',EGP:'جنيه',USD:'دولار'};
var COLS=[{k:'n',t:'م'},{k:'date',t:'التاريخ'},{k:'in',t:'وارد'},{k:'out',t:'منصرف'},{k:'cur',t:'العملة'},{k:'desc',t:'البيان'},{k:'bal',t:'الرصيد التراكمي'},{k:'party',t:'الطرف المقابل'},{k:'entry',t:'رقم القيد'},{k:'act',t:''}];
var V={order:COLS.map(function(c){return c.k;}),hide:{},flt:{}};
function vLoad(){try{var o=JSON.parse(LS('cd_cols|'+S.acc)||'null');V={order:COLS.map(function(c){return c.k;}),hide:{},flt:{}};if(o&&Array.isArray(o.order)){var ok=o.order.filter(function(k){return COLS.some(function(c){return c.k===k;});});COLS.forEach(function(c){if(ok.indexOf(c.k)<0)ok.push(c.k);});V.order=ok;V.hide=o.hide||{};}}catch(e){}}
function vSave(){LS('cd_cols|'+S.acc,JSON.stringify({order:V.order,hide:V.hide}));}
function cols(){var see=S.d&&S.d.see;return V.order.map(function(k){return COLS.filter(function(c){return c.k===k;})[0];}).filter(function(c){return c&&!V.hide[c.k]&&(c.k!=='party'||see);});}
window.pickDesk=function(a){S.acc=a;LS('cd_acc',a);$('desk').value=a;vLoad();S.d=null;editRow(0);load();};
window.load=function(){renewMaybe();rpc('cd_rows',{p_acc:S.acc}).then(function(d){S.d=d;draw();},function(e){if(e.status===401){S.tok='';show(false);}else toast('تعذّر التحميل: '+e.message);});};
function cell(r,c,i){
  if(c.k==='n')return '<td class="num">'+(i+1)+'</td>';
  if(c.k==='date')return '<td class="num">'+esc(r.date)+'</td>';
  if(c.k==='in')return '<td class="num in">'+(+r['in']?fmt(r['in']):'')+'</td>';
  if(c.k==='out')return '<td class="num out">'+(+r.out?fmt(r.out):'')+'</td>';
  if(c.k==='cur')return '<td>'+esc(CUR[r.cur]||r.cur)+'</td>';
  if(c.k==='desc')return '<td class="d">'+esc(r.desc)+'</td>';
  if(c.k==='bal')return '<td class="num"><b>'+fmt(r.bal)+'</b></td>';
  if(c.k==='party')return '<td class="d" style="min-width:140px">'+esc(r.party)+'</td>';
  if(c.k==='entry')return '<td>'+(r.st==='done'?'<span class="tag t2 num">'+esc(r.entry)+'</span>':r.st==='redo'?'<span class="tag t3">معدّلة — بانتظار إعادة الاعتماد</span><div class="num" style="font-size:11px;color:#64748b">'+esc(r.entry)+'</div>':'<span class="tag t1">بانتظار المحاسب</span>')+'</td>';
  var mine=r.id&&(r.by===S.user||(S.d&&S.d.acct));
  return '<td style="white-space:nowrap">'+(r.id?'<button class="lnk" title="سجل الحركة" onclick="hist('+r.id+')">🕘</button>':'')+(mine?'<button class="lnk" title="تعديل" onclick="editRow('+r.id+')">✏️</button>':'')+(mine&&r.st==='pending'?'<button class="lnk" title="حذف" onclick="delRow('+r.id+')">🗑️</button>':'')+'</td>';
}
function txt(r,k){return k==='in'||k==='out'||k==='bal'?String(+r[k]||''):k==='cur'?(CUR[r.cur]||r.cur):k==='entry'?(r.entry||'')+' '+(r.st==='pending'?'بانتظار':r.st==='redo'?'معدلة':''):String(r[k]==null?'':r[k]);}
function draw(){
  var d=S.d;if(!d)return;var C=cols(),pt=!!d.see;
  $('fPartyBox').hidden=!pt;$('frm').className='frm'+(pt?' pt':'');
  if(!S.edit&&!$('fCur').dataset.set){$('fCur').value=d.cur;}
  var T=d.tot||{},ks=Object.keys(T);
  $('kp').innerHTML=(ks.length?ks:[d.cur]).map(function(c){var t=T[c]||{in:0,out:0,bal:0};return '<div><small>الرصيد — '+esc(CUR[c]||c)+'</small><b>'+fmt(t.bal)+'</b><small>وارد <span class="in">'+fmt(t['in'])+'</span> · منصرف <span class="out">'+fmt(t.out)+'</span></small></div>';}).join('')+'<div><small>حركات بانتظار المحاسب</small><b>'+d.pend+'</b><small>من '+d.n+' حركة</small></div>';
  $('th').innerHTML='<tr>'+C.map(function(c){return '<th draggable="true" data-k="'+c.k+'">'+esc(c.t)+'</th>';}).join('')+'</tr><tr class="flt">'+C.map(function(c){return '<td>'+(c.k==='n'||c.k==='act'?'':'<input data-f="'+c.k+'" value="'+esc(V.flt[c.k]||'')+'" placeholder="🔎" oninput="setFlt(this)">')+'</td>';}).join('')+'</tr>';
  drawBody();
  Array.prototype.forEach.call($('th').querySelectorAll('th'),function(h){
    h.ondragstart=function(e){e.dataTransfer.setData('text/plain',h.dataset.k);h.classList.add('dg');};h.ondragend=function(){h.classList.remove('dg');};
    h.ondragover=function(e){e.preventDefault();};h.ondrop=function(e){e.preventDefault();moveCol(e.dataTransfer.getData('text/plain'),h.dataset.k);};});
  if(!$('fDate').value){var t=new Date();$('fDate').value=('0'+t.getDate()).slice(-2)+'/'+('0'+(t.getMonth()+1)).slice(-2)+'/'+t.getFullYear();}
}
function drawBody(){
  var d=S.d,C=cols(),fk=Object.keys(V.flt).filter(function(k){return V.flt[k];});
  var rows=(d.rows||[]).filter(function(r){return fk.every(function(k){return txt(r,k).toLowerCase().indexOf(V.flt[k].toLowerCase())>=0;});});
  $('tb').innerHTML=rows.map(function(r,i){return '<tr class="'+(r.st==='pending'?'pend':r.st==='redo'?'redo':'')+'">'+C.map(function(c){return cell(r,c,i);}).join('')+'</tr>';}).join('')||'<tr><td colspan="'+C.length+'" style="padding:22px;color:#64748b">لا حركات</td></tr>';
  var T={};rows.forEach(function(r){var t=T[r.cur]||(T[r.cur]={i:0,o:0});t.i+=+r['in']||0;t.o+=+r.out||0;});
  $('tf').innerHTML=Object.keys(T).map(function(c){var t=T[c];return '<tr>'+C.map(function(x){return x.k==='in'?'<td class="num in">'+fmt(t.i)+'</td>':x.k==='out'?'<td class="num out">'+fmt(t.o)+'</td>':x.k==='cur'?'<td>'+esc(CUR[c]||c)+'</td>':x.k==='desc'?'<td class="d">الإجماليات'+(fk.length?' (المعروض)':'')+' — الرصيد النهائي</td>':x.k==='bal'?'<td class="num">'+fmt(t.i-t.o)+'</td>':'<td></td>';}).join('')+'</tr>';}).join('');
}
window.setFlt=function(el){V.flt[el.dataset.f]=el.value;drawBody();};
function moveCol(a,b){if(!a||a===b)return;var o=V.order.filter(function(k){return k!==a;});o.splice(o.indexOf(b),0,a);V.order=o;vSave();draw();}
window.colMenu=function(){
  var see=S.d&&S.d.see;
  $('ovB').innerHTML='<b>⚙ الأعمدة — الترتيب والإظهار</b><div style="margin-top:8px">'+V.order.map(function(k,i){var c=COLS.filter(function(x){return x.k===k;})[0];if(!c||c.k==='act'||(c.k==='party'&&!see))return '';
    return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #eef2f6"><label style="flex:1;margin:0;font-size:14px;color:#1f2937"><input type="checkbox" style="width:auto" '+(V.hide[k]?'':'checked')+' onchange="colTog(\''+k+'\',this.checked)"> '+esc(c.t)+'</label><button class="btn b3" style="padding:2px 10px" onclick="colUp(\''+k+'\',-1)">▲</button><button class="btn b3" style="padding:2px 10px" onclick="colUp(\''+k+'\',1)">▼</button></div>';}).join('')+'</div><div style="margin-top:8px"><button class="lnk" onclick="colReset()">↺ الترتيب الافتراضي</button></div>';
  $('ov').hidden=false;
};
window.colTog=function(k,on){if(on)delete V.hide[k];else V.hide[k]=1;vSave();draw();};
window.colUp=function(k,dir){var i=V.order.indexOf(k),j=i+dir;if(j<0||j>=V.order.length)return;var t=V.order[i];V.order[i]=V.order[j];V.order[j]=t;vSave();draw();colMenu();};
window.colReset=function(){LS('cd_cols|'+S.acc,null);vLoad();draw();colMenu();};
window.fixDate=function(el){
  var v=String(el.value||'').trim().replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/[-.\s]+/g,'/'),t=new Date(),m;
  if(/^\d{8}$/.test(v))v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(/^\d{4}$/.test(v))v=v.slice(0,2)+'/'+v.slice(2);
  m=v.match(/^(\d{1,2})(?:\/(\d{1,2}))?(?:\/(\d{2}|\d{4}))?$/);if(!m)return false;
  var dd=+m[1],mm=m[2]?+m[2]:t.getMonth()+1,yy=m[3]?(m[3].length===2?2000+(+m[3]):+m[3]):t.getFullYear();
  if(dd<1||dd>31||mm<1||mm>12)return false;
  el.value=('0'+dd).slice(-2)+'/'+('0'+mm).slice(-2)+'/'+yy;return true;
};
window.pickCal=function(){var c=$('fCal'),m=$('fDate').value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(m)c.value=m[3]+'-'+m[2]+'-'+m[1];try{c.style.pointerEvents='auto';if(c.showPicker)c.showPicker();else{c.focus();c.click();}}catch(e){c.focus();}};
window.calPicked=function(c){var m=String(c.value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)$('fDate').value=m[3]+'/'+m[2]+'/'+m[1];c.style.pointerEvents='none';};
window.chkBoth=function(){var a=parseFloat($('fIn').value)||0,b=parseFloat($('fOut').value)||0;$('ferr').textContent=a>0&&b>0?'⚠️ لا يُسجَّل وارد ومنصرف في حركة واحدة — امسح أحدهما وسجّل الآخر في حركة مستقلة':'';return !(a>0&&b>0);};
window.editRow=function(id){
  S.edit=id||0;var r=id&&S.d?(S.d.rows||[]).filter(function(x){return x.id===id;})[0]:null;
  $('fIn').value=r&&+r['in']?r['in']:'';$('fOut').value=r&&+r.out?r.out:'';$('fDesc').value=r?r.desc:'';$('fParty').value=r?(r.st==='done'?'':r.party):'';if(r)$('fDate').value=r.date;
  $('fCur').value=r?r.cur:((S.d&&S.d.cur)||'SAR');
  $('fBtn').textContent=r?'💾 حفظ التعديل':'➕ تسجيل';$('fCancel').hidden=!r;
  $('ferr').textContent=r&&r.st!=='pending'?'ℹ️ هذه الحركة لها قيد — حفظ التعديل يعيدها للمحاسب للمراجعة وإعادة الاعتماد':'';noDescAsk=0;
  if(r)window.scrollTo({top:0,behavior:'smooth'});
};
var noDescAsk=0;
window.saveRow=function(){
  if(!fixDate($('fDate'))||!/^\d{2}\/\d{2}\/\d{4}$/.test($('fDate').value)){$('ferr').textContent='اكتب التاريخ بصيغة dd/mm/yyyy (يكفي اليوم والشهر وتُكمَّل السنة)';return;}
  if(!chkBoth())return;
  var p={date:$('fDate').value,'in':$('fIn').value.trim(),out:$('fOut').value.trim(),cur:$('fCur').value,desc:$('fDesc').value.trim(),party:$('fParty').value.trim()};
  if(!(parseFloat(p['in'])>0)&&!(parseFloat(p.out)>0)){$('ferr').textContent='اكتب مبلغ الوارد أو المنصرف';return;}
  if(!p.desc&&!noDescAsk){noDescAsk=1;$('ferr').textContent='⚠️ البيان فارغ — اكتب بياناً، أو اضغط «تسجيل» مرة ثانية للحفظ بلا بيان';$('fDesc').focus();return;}
  if(S.edit)p.id=S.edit;
  $('fBtn').disabled=true;$('ferr').textContent='';
  rpc('cd_save',{p_acc:S.acc,p:p}).then(function(r){$('fBtn').disabled=false;toast(r&&r.redo?'✅ حُفظ التعديل — عادت الحركة للمراجعة':S.edit?'✅ حُفظ التعديل':'✅ سُجّلت الحركة');editRow(0);load();$('fIn').focus();},
    function(e){$('fBtn').disabled=false;$('ferr').textContent=e.message;});
};
var delAsk=0;
window.delRow=function(id){
  if(delAsk!==id){delAsk=id;toast('اضغط 🗑️ مرة ثانية لتأكيد الحذف');setTimeout(function(){if(delAsk===id)delAsk=0;},4000);return;}
  delAsk=0;rpc('cd_del',{p_acc:S.acc,p_id:id}).then(function(){toast('🗑️ حُذفت الحركة');load();},function(e){toast(e.message);});
};
window.hist=function(id){
  $('ovB').innerHTML='<b>🕘 سجل الحركة</b><div style="padding:14px;color:#64748b">⏳</div>';$('ov').hidden=false;
  rpc('cd_history',{p_acc:S.acc,p_id:id}).then(function(h){var rs=(h&&h.rows)||[];
    $('ovB').innerHTML='<b>🕘 سجل الحركة</b>'+(rs.length?rs.map(function(x){return '<div style="border-bottom:1px solid #eef2f6;padding:7px 0;font-size:13.5px"><div><b>'+esc(x.action)+'</b> — '+esc(x.user)+' <span class="num" style="color:#64748b;font-size:12px">'+esc(x.ts)+'</span></div>'+(x.old&&x.old!=='-'?'<div style="color:#b91c1c">قبل: '+esc(x.old)+'</div>':'')+(x['new']&&x['new']!=='-'?'<div style="color:#15803d">بعد: '+esc(x['new'])+'</div>':'')+'</div>';}).join(''):'<div style="padding:14px;color:#64748b">لا سجلات بعد</div>')+(h&&h.pending?'<div style="color:#92400e;font-size:12.5px;margin-top:6px">⏳ '+h.pending+' عملية حديثة تُضاف للسجل خلال دقيقة</div>':'');
  },function(e){$('ovB').innerHTML='<div class="err">'+esc(e.message)+'</div>';});
};
document.addEventListener('keydown',function(e){if(e.key==='Enter'){if(!$('login').hidden)doLogin();else if(e.target&&/^f(Date|In|Out|Desc|Party)$/.test(e.target.id)){if(e.target.id==='fDate')fixDate(e.target);saveRow();}}});
setInterval(function(){if(S.tok&&!document.hidden&&!S.edit&&!Object.keys(V.flt).some(function(k){return V.flt[k];})&&document.activeElement&&!/^f/.test(document.activeElement.id||''))load();},60000);
resume().then(function(ok){if(ok)start();else show(false);});
})();
</script>
</body>
</html>
